name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck .bashrc
        run: shellcheck -s bash .bashrc

      - name: Validate JSON (JSONC-aware)
        run: |
          python3 -c '
          import json, re, sys
          failed = False
          for path in sys.argv[1:]:
              text = open(path).read()
              # Strip whole-line "//" comments (VS Code JSONC allows them).
              stripped = re.sub(r"^\s*//.*$", "", text, flags=re.MULTILINE)
              try:
                  json.loads(stripped)
                  print(f"OK: {path}")
              except json.JSONDecodeError as e:
                  print(f"FAIL: {path}: {e}")
                  failed = True
          sys.exit(1 if failed else 0)
          ' keybindings.json .mcp.json
